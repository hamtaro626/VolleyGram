<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-2 Rotations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>4-2 Rotations</h1>

    <div class="court" id="court">
      <div class="net"></div>
      <div class="attack-line"></div>
      <!-- The six players get created by script.js -->
    </div>

    <p class="status" id="status"></p>

    <div class="rotations" id="rotationButtons">
      <!-- The six rotation buttons get created by script.js -->
    </div>

    <div class="actions">
      <button id="prev">&lsaquo; Prev</button>
      <button id="reset">Reset</button>
      <button id="next">Next &rsaquo;</button>
    </div>

    <div class="actions two">
      <button id="toggleRoster" aria-expanded="false">Roster</button>
      <button id="toggleLabels" aria-pressed="true">Labels: on</button>
    </div>

    <section class="roster" id="roster" hidden>
      <!-- The six name fields get created by script.js -->
      <button id="resetAll" class="danger">Reset all rotations</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
