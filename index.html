<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Working title. Short on purpose: this is the browser tab, the bookmark,
       and the home-screen shortcut, all of which truncate. The description
       lives beside the mark in the <h1>. -->
  <title>VolleyGram</title>
  <meta name="apple-mobile-web-app-title" content="VolleyGram">
  <!-- Must match body's background in style.css, or the browser chrome and the
       page disagree by a shade on a phone. -->
  <meta name="theme-color" content="#16181d">

  <!-- Icons. All PNG and all opaque: iOS ignores alpha on a home-screen icon
       and fills it with black, so the app's own background is baked in on
       purpose rather than arrived at by accident. The maskable one is a
       separate file because Android crops to a circle of 80% diameter, which
       would take the ends off a wordmark drawn to the edges. -->
  <link rel="icon" href="assets/favicon-32.png?v=0.46" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-180.png?v=0.46">
  <link rel="manifest" href="manifest.webmanifest?v=0.46">

  <!-- Link previews. The share feature sends URLs to team-mates by text, so
       these are what a chat app draws in the bubble. og:image has to be
       absolute -- a crawler has no page to resolve a relative path against. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="VolleyGram">
  <meta property="og:description" content="A volleyball rotation reference. See where everyone stands in every rotation.">
  <meta property="og:url" content="https://hamtaro626.github.io/VolleyGram/">
  <meta property="og:image" content="https://hamtaro626.github.io/VolleyGram/assets/og.png?v=0.46">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The ?v= query is cache busting. A browser caches by URL, so changing the
       query makes style.css a URL it has never seen and must fetch fresh.
       Bump this on any release that changes the CSS or JS, or phones will keep
       showing the old one. -->
  <link rel="stylesheet" href="style.css?v=0.46">
</head>
<body>
  <main>
    <!-- A lockup, not a stack: the mark is a wordmark that already says the
         name, so the text beside it is the description only. Spelling the name
         out again next to a logo of the name is the usual way this goes wrong.
         Side by side rather than above also costs about 2rem of height instead
         of 5, which matters -- see main's clamp in style.css.

         The button is a real button inside the heading, rather than a heading
         with role="button": that keeps the h1 a heading for a screen reader and
         still gives the tap target proper keyboard and focus behaviour. Only
         the mark is the button; the description is not, or the whole width of
         the header would replay the intro by accident.

         width and height are the file's real pixel size. They cost nothing and
         they reserve the space before the image arrives, so the court does not
         jump down the screen mid-load. -->
    <h1 class="masthead">
      <button type="button" id="replayIntro" class="title-replay"
        title="Replay the intro" aria-label="VolleyGram. Replay the intro."
        ><img class="logo" src="assets/logo.webp?v=0.46" width="179" height="200"
          alt="VolleyGram"></button>
      <span class="tagline">A Volleyball Rotation Reference</span>
    </h1>

    <label class="picker">
      <span>VolleyGram Name</span>
      <select id="lineup"><!-- filled by script.js --></select>
    </label>

    <label class="picker">
      <span>Rotation System</span>
      <select id="system"><!-- filled by script.js --></select>
    </label>

    <div class="court" id="court">
      <div class="net"></div>
      <div class="attack-line"></div>
      <div class="bench"><span>Off court</span></div>
      <!-- The players get created by script.js -->
      <!-- Tappable zone cells, only live during a quiz -->
      <div class="zone-targets" id="zoneTargets"></div>
    </div>

    <!-- polite: announce the new rotation after the tap, not over it -->
    <p class="status" id="status" aria-live="polite"></p>

    <!-- Formation tabs sit high, right under the court: switching between base,
         serve receive and defense is the thing this app is for. -->
    <div class="formations" id="formationButtons">
      <!-- filled by script.js -->
    </div>

    <div class="formation-options" id="receiveOptions" hidden>
      <label class="setting">
        <span>Passers</span>
        <select id="passers"><!-- filled by script.js --></select>
      </label>
    </div>

    <div class="formation-options" id="defenseOptions" hidden>
      <label class="setting">
        <span>System</span>
        <select id="defenseSystem"><!-- filled by script.js --></select>
      </label>
      <label class="setting">
        <span>Attack from</span>
        <select id="defenseSide">
          <option value="right">Our right (their outside)</option>
          <option value="left">Our left (their right side)</option>
        </select>
      </label>
    </div>

    <!-- Text rather than drawn icons: the SVG versions rendered as empty
         rectangles. The arrows keep an aria-label, since "<" says nothing aloud. -->
    <div class="actions two">
      <button id="prev" class="glyph" aria-label="Previous rotation" title="Previous rotation">&lt;</button>
      <button id="next" class="glyph" aria-label="Next rotation" title="Next rotation">&gt;</button>
    </div>

    <div class="actions two">
      <button id="undo" disabled>Undo</button>
      <button id="reset">Reset</button>
    </div>

    <div class="rotations" id="rotationButtons">
      <!-- The rotation buttons get created by script.js -->
    </div>

    <!-- The two screens that replace the app while you are in them. That is a
         real category, which is why this row can be read without a label. -->
    <div class="actions two">
      <button id="openScoreboard">Scoreboard</button>
      <button id="startQuiz">Quiz Mode</button>
    </div>

    <!-- A display toggle, and the drawer for handing the diagram to something
         else. One job each, so both say what they are. -->
    <div class="actions two">
      <button id="toggleLabels" aria-pressed="true">Labels: on</button>
      <button id="toggleShare" aria-expanded="false" aria-controls="shareMenu">Share&hellip;</button>
    </div>

    <div class="submenu" id="shareMenu" hidden>
      <!-- All three across. "Save all" rather than "Save all rotations": at
           320px this row gets about 90px a column and the longer label needs
           123px, so it was the label or the row. -->
      <div class="actions compact">
        <button id="shareLink">Share team</button>
        <button id="exportImage">Save image</button>
        <button id="exportAll">Save all</button>
      </div>
      <!-- The setting that governs both exports, next to them. -->
      <label class="setting toggle">
        <input type="checkbox" id="transparentExport">
        <span>Transparent background</span>
      </label>
    </div>

    <!-- Alone: it opens the longest panel in the app, and it is the one you
         leave open while editing a lineup. -->
    <div class="actions one">
      <button id="toggleRoster" aria-expanded="false">Show roster</button>
    </div>

    <!-- Last, and alone. It's the one control you least want a thumb to find by
         accident, so nothing sits beside it and nothing follows it. -->
    <div class="actions one">
      <button id="resetAll" class="hold-reset danger">
        <span>Hold to reset all</span>
      </button>
    </div>

    <section class="quiz" id="quiz" hidden>
      <p class="quiz-question" id="quizQuestion"></p>
      <p class="quiz-feedback" id="quizFeedback"></p>
      <div class="quiz-actions">
        <button id="quizNext">Next question</button>
        <button id="endQuiz">End quiz</button>
      </div>
      <p class="quiz-score" id="quizScore"></p>
    </section>

    <section class="roster" id="roster" hidden>
      <div id="rosterRows">
        <!-- The name fields get created by script.js -->
      </div>

      <button id="addPlayer">+ Add player</button>

      <label class="setting">
        <span>Surface</span>
        <select id="surface"><!-- filled by script.js --></select>
      </label>

      <label class="setting">
        <span>Subs enter at</span>
        <select id="entrySlot"><!-- filled by script.js --></select>
      </label>

      <!-- Shown only when the choice has a visible consequence. -->
      <p class="setting-note" id="entryNote" hidden>
        Whoever is off court at rotation 1 is the next server, not the last
        player on your roster &mdash; that's what entering here means. Serving
        order still follows the roster top to bottom.
      </p>

      <label class="setting">
        <span>Role edits apply to</span>
        <select id="roleScope">
          <option value="all">All rotations</option>
          <option value="rotation">This rotation only</option>
        </select>
      </label>

      <button id="clearRoleOverrides">Clear per-rotation roles</button>

      <label class="setting toggle">
        <input type="checkbox" id="checkOverlap">
        <span>Flag overlap violations (base only)</span>
      </label>

      <div class="lineup-actions">
        <button id="newLineup">New lineup</button>
        <button id="duplicateLineup">Duplicate</button>
        <button id="renameLineup">Rename</button>
        <button id="deleteLineup" class="danger">Delete</button>
      </div>
    </section>
  </main>

  <!-- The scoreboard, outside <main> because it replaces the whole page rather
       than sitting inside it. Landscape and iPad are the target: prop the thing
       up on the bench and read it from the far side of the court. -->
  <section class="scoreboard" id="scoreboard" hidden>
    <div class="sb-head">
      <span class="sb-game" id="sbGame">Game 1</span>
      <button id="closeScoreboard" class="sb-close">Done</button>
    </div>

    <!-- Red and blue rather than labels: which half is which has to be readable
         from further away than any word on this screen. -->
    <div class="sb-teams">
      <div class="sb-team side-home">
        <input class="sb-name" id="sbHomeName" maxlength="20"
               aria-label="Home team name" autocomplete="off" spellcheck="false">
        <button class="sb-point" id="sbHomePoint" aria-label="Point to the home team">
          <span class="sb-score" id="sbHomeScore">0</span>
        </button>
      </div>

      <div class="sb-team side-away">
        <input class="sb-name" id="sbAwayName" maxlength="20"
               aria-label="Away team name" autocomplete="off" spellcheck="false">
        <button class="sb-point" id="sbAwayPoint" aria-label="Point to the away team">
          <span class="sb-score" id="sbAwayScore">0</span>
        </button>
      </div>
    </div>

    <div class="sb-actions">
      <button id="sbUndo" disabled>Undo point</button>
      <button id="sbEndGame">End game</button>
    </div>

    <!-- Ending a game asks who took it. That answer is the match record, and
         it's the one thing nobody remembers by game four. -->
    <div class="sb-newgame" id="sbNewGame" hidden>
      <p class="sb-final" id="sbFinal"></p>
      <div class="sb-winners">
        <button class="sb-won side-home" id="sbHomeWon">Home won</button>
        <button class="sb-won side-away" id="sbAwayWon">Away won</button>
      </div>
      <div class="sb-newgame-actions">
        <button id="sbNoResult">Next game, no result</button>
        <button id="sbCancelGame">Cancel</button>
      </div>
    </div>
  </section>

  <!-- Which build you're actually looking at. Fixed in the corner so checking it
       never means scrolling, and filled by script.js from its own URL. -->
  <p class="version" id="version"></p>

  <script src="script.js?v=0.46"></script>
</body>
</html>
