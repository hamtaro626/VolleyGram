<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-2 Rotations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Rotation Reference</h1>

    <label class="picker">
      <select id="lineup"><!-- filled by script.js --></select>
    </label>

    <label class="picker">
      <select id="system"><!-- filled by script.js --></select>
    </label>

    <div class="court" id="court">
      <div class="net"></div>
      <div class="attack-line"></div>
      <div class="bench"><span>Off court</span></div>
      <!-- The players get created by script.js -->
    </div>

    <p class="status" id="status"></p>

    <div class="rotations" id="rotationButtons">
      <!-- The rotation buttons get created by script.js -->
    </div>

    <div class="actions two">
      <button id="prev">&lsaquo; Prev</button>
      <button id="next">Next &rsaquo;</button>
    </div>

    <div class="actions two">
      <button id="undo" disabled>Undo</button>
      <button id="reset">Reset rotation</button>
    </div>

    <div class="actions one">
      <button id="resetAll" class="hold-reset danger">
        <span>Hold to reset all</span>
      </button>
    </div>

    <div class="actions two">
      <button id="toggleLabels" aria-pressed="true">Labels: on</button>
      <button id="exportImage">Save as image</button>
    </div>

    <div class="actions one">
      <button id="toggleRoster" aria-expanded="false">Show roster</button>
    </div>

    <section class="roster" id="roster" hidden>
      <div id="rosterRows">
        <!-- The name fields get created by script.js -->
      </div>

      <button id="addPlayer">+ Add player</button>

      <label class="setting">
        <span>Subs enter at</span>
        <select id="entrySlot"><!-- filled by script.js --></select>
      </label>

      <label class="setting">
        <span>Role edits apply to</span>
        <select id="roleScope">
          <option value="all">All rotations</option>
          <option value="rotation">This rotation only</option>
        </select>
      </label>

      <button id="clearRoleOverrides">Clear per-rotation roles</button>
      <button id="exportAll">Save all rotations as one image</button>

      <div class="lineup-actions">
        <button id="newLineup">New lineup</button>
        <button id="duplicateLineup">Duplicate</button>
        <button id="renameLineup">Rename</button>
        <button id="deleteLineup" class="danger">Delete</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
